services:
  api:
    build:
      context: .
      dockerfile: E-Commerce/Dockerfile
    ports:
      - "5000:8080"
    environment:
      - ConnectionStrings__ECommerceConnection=Username=postgres;Password=123456;Server=postgres;Database=ecommercedb
      - ConnectionStrings__Redis=redis:6379
      - Jwt__Key=your-super-secret-key-min-32-chars!!
      - Jwt__Issuer=ECommerceAPI
      - Jwt__Audience=ECommerceClient
      - Jwt__AccessTokenExpirationMinutes=30
      - Jwt__RefreshTokenExpirationDays=7
    depends_on:
      - postgres
      - redis

  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ecommercedb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123456
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"

volumes:
  pgdata:
